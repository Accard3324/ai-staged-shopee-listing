name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-unittest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression suite
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py"

