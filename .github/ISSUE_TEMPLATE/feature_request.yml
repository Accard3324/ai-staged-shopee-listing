name: Feature request
description: Propose a scoped improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Main area
      options:
        - AI staging
        - Human review
        - Deterministic browser execution
        - Safety or verification
        - Workbook or configuration
        - Documentation or contributor tooling
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, data, or external-service impact
      description: Explain any effect on credentials, live publication, account permissions, provider costs, or private data.

